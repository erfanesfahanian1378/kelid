[project]
name = "kelid-data-pipeline"
version = "0.1.0"
description = "Kelid (کلید) language data pipeline — Persian/English unigram/bigram/trigram counts, emoji data, and evaluation sets (PLAN.md Phase 6)."
requires-python = ">=3.11"
dependencies = [
    "hazm>=0.10.0",
    # hazm 0.10's sequence-tagger import chain pulls in a scipy build that
    # segfaults on import on this environment's arm64 macOS (a broken
    # `_propack` binary in scipy 1.15.x's wheel) — pinning scipy 1.13.1
    # sidesteps it. Only `hazm.normalizer.Normalizer` and `hazm.word_tokenize`/
    # `hazm.sent_tokenize` are actually used; nothing here needs the tagger.
    "scipy==1.13.1",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "regex>=2024.0.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]
